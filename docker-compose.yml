services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peg
      POSTGRES_USER: peg
      POSTGRES_PASSWORD: peg
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/portfolioexposure
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
